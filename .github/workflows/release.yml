# Release: the GitHub Release of each vX.Y.Z tag the GitFlow finish pushes, its notes the tag's section of
# CHANGELOG.md (the shared github-release). Main already published the packages.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    uses: JorgeCostaMacia/github-workflows/.github/workflows/github-release.yml@v1
